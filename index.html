<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Alessandra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Minha To-Do List</h1>

    <form id="form">
      <input type="text" id="input" placeholder="Digite uma nova tarefa..." autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <div class="filtros">
      <button class="filtro ativo" data-filtro="todas">Todas</button>
      <button class="filtro" data-filtro="pendentes">Pendentes</button>
      <button class="filtro" data-filtro="concluidas">Concluídas</button>
    </div>

    <ul id="lista"></ul>

    <div class="rodape">
      <span id="contador">0 tarefas</span>
      <button id="limpar">Limpar concluídas</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
